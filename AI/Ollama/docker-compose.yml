# Ollama: run open-weight LLMs and embedding models locally behind an HTTP API (native /api/* and an
# OpenAI-compatible /v1). API: http://localhost:11434 (from other stacks http://ollama:11434)
# ollama-init pulls the models in OLLAMA_MODELS (once; later runs only check for updates).
# CPU by default. NVIDIA GPU (Docker Desktop + WSL2, or Linux with the NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      # Browser apps / Open WebUI on other origins may call the API
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      GroupNetwork:
        ipv4_address: ${OLLAMA_IP:-172.20.27.10}
        aliases:
          - ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434" # API (native + OpenAI-compatible /v1)
  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    container_name: ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${OLLAMA_MODELS:-llama3.2:3b,nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for m in $$(echo "$$MODELS" | tr ',' ' '); do
          if ollama pull "$$m" >/tmp/pull.log 2>&1; then echo "pulled $$m"
          else tail -n 1 /tmp/pull.log; echo "could not pull $$m"; fi
        done
        ollama list
    networks:
      GroupNetwork:
        ipv4_address: ${OLLAMA_INIT_IP:-172.20.27.11}
volumes:
  ollama_models:
    name: ollama_models
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/AI/Ollama/models
networks:
  GroupNetwork:
    driver: bridge
    external: true

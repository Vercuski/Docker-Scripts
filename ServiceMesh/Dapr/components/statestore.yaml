# State store + actor state on the Redis stack (Databases/Redis)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      secretKeyRef:
        name: REDIS_PASSWORD
        key: REDIS_PASSWORD
    - name: redisDB
      value: "4"
    - name: actorStateStore
      value: "true"
auth:
  secretStore: envsecrets

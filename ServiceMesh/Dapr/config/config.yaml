# Dapr configuration for the sidecar: distributed tracing to the OpenTelemetry stack (otel-collector, OTLP/gRPC),
# every request sampled. Without that stack running, the sidecar only logs export errors.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: daprConfig
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: otel-collector:4317
      isSecure: false
      protocol: grpc
  metric:
    enabled: true

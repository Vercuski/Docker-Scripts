# Databases/ClickHouse stack
connector.name=clickhouse
# compress=0: with compression on, the JDBC driver bundled in Trino 484 fails against current
# ClickHouse servers ("Magic is not correct"). Uncompressed is fine on a local network.
connection-url=jdbc:clickhouse://clickhouse:8123/?compress=0
connection-user=${ENV:TRINO_CLICKHOUSE_USER}
connection-password=${ENV:TRINO_CLICKHOUSE_PASSWORD}

services:
  seq:
    image: datalust/seq:${SEQ_VERSION:-latest}
    container_name: seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Only used the first time the container initializes /data.
      # You'll be prompted to change it on first login.
      SEQ_FIRSTRUN_ADMINUSERNAME: ${SEQ_ADMIN_USERNAME:-admin}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-Password123}
      # Public URL used when Seq generates links (alerts, notifications, etc.)
      SEQ_API_CANONICALURI: ${SEQ_CANONICAL_URI:-http://localhost:8089}
    ports:
      # UI + API (also accepts ingestion, including OTLP at /ingest/otlp)
      - "${SEQ_UI_PORT:-8089}:80" # 8081 is used by MediaWiki
      # Ingestion-only endpoint (safe to expose to apps without exposing the UI)
      - "${SEQ_INGEST_PORT:-5341}:5341"
    volumes:
      - seq_data:/data
    networks:
      GroupNetwork:
        ipv4_address: ${SEQ_IP:-192.168.16.191}
        aliases:
          - seq
volumes:
  seq_data:
    name: seq_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Analytics/Seq/data
networks:
  GroupNetwork:
    driver: bridge
    external: true
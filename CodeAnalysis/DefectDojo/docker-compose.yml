# DefectDojo: imports and de-duplicates findings from 200+ scanners (Trivy, SonarQube, ZAP, Dependency-Track, ...)
# and tracks them per product. Based on DefectDojo's docker-compose.yml, using the PostgreSQL stack for its database.
x-defectdojo-env: &defectdojo-env
  DD_DATABASE_URL: ${DEFECTDOJO_DATABASE_URL:-postgresql://user%40user.com:Password123@postgresql:5432/defectdojo}
  DD_CELERY_BROKER_URL: redis://defectdojo-valkey:6379/0
  DD_CACHE_URL: redis://defectdojo-valkey:6379/1
  DD_SECRET_KEY: ${DEFECTDOJO_SECRET_KEY:-LocalDevOnly-defectdojo-secret-key-0123456789}
  DD_CREDENTIAL_AES_256_KEY: ${DEFECTDOJO_CREDENTIAL_AES_256_KEY:-LocalDevOnlyDefectDojoAesKey32Ch}
  DD_DATABASE_READINESS_TIMEOUT: "60"
  DD_ALLOWED_HOSTS: "*"
services:
  # One-shot: creates the defectdojo database in the PostgreSQL stack if it doesn't exist yet
  defectdojo-db-init:
    image: ${DEFECTDOJO_DB_INIT_IMAGE:-postgres:18}
    container_name: defectdojo-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${DEFECTDOJO_DB_USER:-user@user.com}
      PGPASSWORD: ${DEFECTDOJO_DB_PASSWORD:-Password123}
      DB_NAME: ${DEFECTDOJO_DB_NAME:-defectdojo}
    command:
      - sh
      - -c
      - |
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          && echo "database $$DB_NAME exists" \
          || psql -d postgres -c "CREATE DATABASE \"$$DB_NAME\""
    networks:
      GroupNetwork:
        ipv4_address: ${DEFECTDOJO_DB_INIT_IP:-172.20.4.40}
        aliases:
          - defectdojo-db-init
  # One-shot: applies database migrations and creates the admin user (skips steps that are already done)
  defectdojo-initializer:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.5.103}
    container_name: defectdojo-initializer
    restart: "no"
    depends_on:
      defectdojo-db-init:
        condition: service_completed_successfully
    entrypoint: ['/wait-for-it.sh', 'postgresql:5432', '-t', '60', '--', '/entrypoint-initializer.sh']
    environment:
      <<: *defectdojo-env
      DD_ADMIN_USER: ${DEFECTDOJO_ADMIN_USER:-admin}
      DD_ADMIN_PASSWORD: ${DEFECTDOJO_ADMIN_PASSWORD:-Password123}
      DD_ADMIN_MAIL: ${DEFECTDOJO_ADMIN_MAIL:-admin@example.com}
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: User
      DD_INITIALIZE: "true"
    networks:
      GroupNetwork:
        ipv4_address: ${DEFECTDOJO_INITIALIZER_IP:-172.20.4.41}
        aliases:
          - defectdojo-initializer
  defectdojo-uwsgi:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.5.103}
    container_name: defectdojo-uwsgi
    restart: unless-stopped
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', 'postgresql:5432', '-t', '60', '--', '/entrypoint-uwsgi.sh']
    environment: *defectdojo-env
    volumes:
      - defectdojo_media:/app/media
    networks:
      GroupNetwork:
        ipv4_address: ${DEFECTDOJO_UWSGI_IP:-172.20.4.42}
        aliases:
          - defectdojo-uwsgi
  defectdojo-celerybeat:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.5.103}
    container_name: defectdojo-celerybeat
    restart: unless-stopped
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', 'postgresql:5432', '-t', '60', '--', '/entrypoint-celery-beat.sh']
    environment: *defectdojo-env
    networks:
      GroupNetwork:
        ipv4_address: ${DEFECTDOJO_CELERYBEAT_IP:-172.20.4.43}
        aliases:
          - defectdojo-celerybeat
  defectdojo-celeryworker:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.5.103}
    container_name: defectdojo-celeryworker
    restart: unless-stopped
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-valkey:
        condition: service_started
    entrypoint: ['/wait-for-it.sh', 'postgresql:5432', '-t', '60', '--', '/entrypoint-celery-worker.sh']
    environment: *defectdojo-env
    volumes:
      - defectdojo_media:/app/media
    networks:
      GroupNetwork:
        ipv4_address: ${DEFECTDOJO_CELERYWORKER_IP:-172.20.4.44}
        aliases:
          - defectdojo-celeryworker
  defectdojo-nginx:
    image: defectdojo/defectdojo-nginx:${DEFECTDOJO_VERSION:-3.5.103}
    container_name: defectdojo-nginx
    restart: unless-stopped
    depends_on:
      - defectdojo-uwsgi
    environment:
      DD_UWSGI_HOST: defectdojo-uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    networks:
      GroupNetwork:
        ipv4_address: ${DEFECTDOJO_NGINX_IP:-172.20.4.45}
        aliases:
          - defectdojo
    ports:
      - "${DEFECTDOJO_PORT:-8102}:8080" # Web UI + REST API
  # Private Celery broker and cache (no host port)
  defectdojo-valkey:
    image: valkey/valkey:${DEFECTDOJO_VALKEY_VERSION:-9.1-alpine}
    container_name: defectdojo-valkey
    restart: unless-stopped
    volumes:
      - defectdojo_valkey:/data
    networks:
      GroupNetwork:
        ipv4_address: ${DEFECTDOJO_VALKEY_IP:-172.20.4.46}
        aliases:
          - defectdojo-valkey
volumes:
  defectdojo_media:
    name: defectdojo_media
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/CodeAnalysis/DefectDojo/media
  defectdojo_valkey:
    name: defectdojo_valkey
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/CodeAnalysis/DefectDojo/valkey
networks:
  GroupNetwork:
    driver: bridge
    external: true

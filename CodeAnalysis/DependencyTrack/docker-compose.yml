# OWASP Dependency-Track: tracks components and known vulnerabilities from CycloneDX SBOMs (e.g. from
# `dotnet CycloneDX`). Backed by the PostgreSQL stack.
services:
  # One-shot: creates the dtrack database in the PostgreSQL stack if it doesn't exist yet
  dtrack-db-init:
    image: ${DTRACK_DB_INIT_IMAGE:-postgres:18}
    container_name: dtrack-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${DTRACK_DB_USER:-user@user.com}
      PGPASSWORD: ${DTRACK_DB_PASSWORD:-Password123}
      DB_NAME: ${DTRACK_DB_NAME:-dtrack}
    command:
      - sh
      - -c
      - |
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          && echo "database $$DB_NAME exists" \
          || psql -d postgres -c "CREATE DATABASE \"$$DB_NAME\""
    networks:
      GroupNetwork:
        ipv4_address: ${DTRACK_DB_INIT_IP:-172.20.4.20}
        aliases:
          - dtrack-db-init
  dtrack-apiserver:
    image: ghcr.io/dependencytrack/apiserver:${DTRACK_VERSION:-5.2.1}
    container_name: dtrack-apiserver
    restart: unless-stopped
    mem_limit: ${DTRACK_APISERVER_MEM_LIMIT:-2g}
    depends_on:
      dtrack-db-init:
        condition: service_completed_successfully
    environment:
      DT_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/${DTRACK_DB_NAME:-dtrack}
      DT_DATASOURCE_USERNAME: ${DTRACK_DB_USER:-user@user.com}
      DT_DATASOURCE_PASSWORD: ${DTRACK_DB_PASSWORD:-Password123}
    volumes:
      - dtrack_data:/data
    networks:
      GroupNetwork:
        ipv4_address: ${DTRACK_APISERVER_IP:-172.20.4.21}
        aliases:
          - dtrack-apiserver
    ports:
      - "${DTRACK_API_PORT:-8098}:8080" # REST API (8080 is used by CockroachDB)
  dtrack-frontend:
    image: ghcr.io/dependencytrack/frontend:${DTRACK_VERSION:-5.2.1}
    container_name: dtrack-frontend
    restart: unless-stopped
    depends_on:
      - dtrack-apiserver
    environment:
      # The single-page app runs in your browser, so it needs the API's host URL, not the container name
      API_BASE_URL: http://localhost:${DTRACK_API_PORT:-8098}
    networks:
      GroupNetwork:
        ipv4_address: ${DTRACK_FRONTEND_IP:-172.20.4.22}
        aliases:
          - dtrack-frontend
    ports:
      - "${DTRACK_UI_PORT:-8099}:8080" # Web UI
volumes:
  dtrack_data:
    name: dtrack_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/CodeAnalysis/DependencyTrack/data
networks:
  GroupNetwork:
    driver: bridge
    external: true

services:
  sonarqube:
    image: sonarqube:${SONARQUBE_VERSION:-community}
    container_name: sonarqube
    restart: unless-stopped
    environment:
      # PostgreSQL alternative: SONAR_JDBC_URL=jdbc:postgresql://postgresql:5432/sonar
      SONAR_JDBC_URL: "${SONAR_JDBC_URL:-jdbc:sqlserver://mssqldb;databaseName=sonar;encrypt=true;trustServerCertificate=true;}"
      # Login created by CreateMSSQLDbScript.sql / CreatePostgreSQLDbScript.sql
      SONAR_JDBC_USERNAME: "${SONAR_JDBC_USERNAME:-sonarqube}"
      SONAR_JDBC_PASSWORD: "${SONAR_JDBC_PASSWORD:-Password123}"
    volumes:
      # Paths are case-sensitive inside the container (/opt/sonarqube, not /opt/SonarQube)
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    networks:
      GroupNetwork:
        ipv4_address: ${SONARQUBE_IP:-192.168.16.170}
        aliases:
          - sonarqube
volumes:
  sonarqube_data:
    name: sonarqube_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/CodeAnalysis/SonarQube/data/
  sonarqube_extensions:
    name: sonarqube_extensions
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/CodeAnalysis/SonarQube/extensions/
  sonarqube_logs:
    name: sonarqube_logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/CodeAnalysis/SonarQube/logs/
networks:
  GroupNetwork:
    driver: bridge
    external: true

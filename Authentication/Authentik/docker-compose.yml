# authentik identity provider (OIDC, OAuth2, SAML, LDAP, proxy) backed by the PostgreSQL stack.
x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-LocalDevOnly-authentik-secret-key-change-me-0123456789abcdef}
  AUTHENTIK_POSTGRESQL__HOST: postgresql
  AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_DB_NAME:-authentik}
  AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_DB_USER:-user@user.com}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-Password123}
  AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-Password123}
  AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
  AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-LocalDevOnly-authentik-api-token}
  AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL_HOST:-mailpit}
  AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL_PORT:-1025}
  AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL_FROM:-authentik@localhost}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  # The defaults listen on [::] only, which fails on hosts with IPv6 disabled in containers
  AUTHENTIK_LISTEN__HTTP: "0.0.0.0:9000"
  AUTHENTIK_LISTEN__HTTPS: "0.0.0.0:9443"
  AUTHENTIK_LISTEN__METRICS: "0.0.0.0:9300"
services:
  # One-shot: creates the authentik database in the PostgreSQL stack if it doesn't exist yet
  authentik-db-init:
    image: ${AUTHENTIK_DB_INIT_IMAGE:-postgres:18}
    container_name: authentik-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${AUTHENTIK_DB_USER:-user@user.com}
      PGPASSWORD: ${AUTHENTIK_DB_PASSWORD:-Password123}
      DB_NAME: ${AUTHENTIK_DB_NAME:-authentik}
    command:
      - sh
      - -c
      - |
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          && echo "database $$DB_NAME exists" \
          || psql -d postgres -c "CREATE DATABASE \"$$DB_NAME\""
    networks:
      GroupNetwork:
        ipv4_address: ${AUTHENTIK_DB_INIT_IP:-172.20.2.30}
        aliases:
          - authentik-db-init
  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.5}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    shm_size: 512mb
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    environment: *authentik-env
    volumes:
      - authentik_data:/data
      - authentik_templates:/templates
    networks:
      GroupNetwork:
        ipv4_address: ${AUTHENTIK_SERVER_IP:-172.20.2.31}
        aliases:
          - authentik
    ports:
      - "${AUTHENTIK_HTTP_PORT:-8290}:9000" # 9000 is used by SonarQube
      - "${AUTHENTIK_HTTPS_PORT:-8445}:9443" # 9443 is used by Portainer (self-signed certificate)
  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2026.8.5}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    shm_size: 512mb
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    environment: *authentik-env
    volumes:
      - authentik_data:/data
      - authentik_certs:/certs
      - authentik_templates:/templates
    networks:
      GroupNetwork:
        ipv4_address: ${AUTHENTIK_WORKER_IP:-172.20.2.32}
        aliases:
          - authentik-worker
volumes:
  authentik_data:
    name: authentik_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Authentication/Authentik/data
  authentik_certs:
    name: authentik_certs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Authentication/Authentik/certs
  authentik_templates:
    name: authentik_templates
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Authentication/Authentik/templates
networks:
  GroupNetwork:
    driver: bridge
    external: true

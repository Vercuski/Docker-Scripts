services:
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-management-alpine}
    container_name: rabbitmq
    # RabbitMQ stores data per node name (rabbit@<hostname>). Without a fixed hostname every
    # re-created container gets a new random name and the existing data is ignored.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-guest}"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672" # Management UI
      - "${RABBITMQ_METRICS_PORT:-15692}:15692" # Prometheus metrics
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
      - rabbitmq_log:/var/log/rabbitmq
    networks:
      GroupNetwork:
        ipv4_address: ${RABBITMQ_IP:-192.168.16.72}
        aliases:
          - rabbitmq
volumes:
  rabbitmq_data:
    name: rabbitmq_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Messaging/RabbitMQ/data/
  rabbitmq_log:
    name: rabbitmq_log
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Messaging/RabbitMQ/log/
networks:
  GroupNetwork:
    driver: bridge
    external: true

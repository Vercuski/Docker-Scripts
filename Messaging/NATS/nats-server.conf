# NATS server configuration. $VARS come from the container environment (docker-compose.yml / .env).
server_name: nats-local
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
}

jetstream {
  store_dir: /data
  max_memory_store: $NATS_JS_MAX_MEMORY
  max_file_store: $NATS_JS_MAX_FILE
}

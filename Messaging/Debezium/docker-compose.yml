# Debezium on Kafka Connect: streams row-level changes from databases into Kafka topics (change data capture).
# Requires the Kafka stack (kafka:29092). Connectors are added through the REST API at http://localhost:8118
# (see ReadMe.md and postgres-connector.json) or from Kafka UI (http://localhost:8084 > Kafka Connect).
# Stateless: connector configs and offsets live in Kafka topics.
services:
  debezium:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.7}
    container_name: debezium
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: ${DEBEZIUM_GROUP_ID:-debezium}
      CONFIG_STORAGE_TOPIC: ${DEBEZIUM_CONFIG_TOPIC:-debezium_connect_configs}
      OFFSET_STORAGE_TOPIC: ${DEBEZIUM_OFFSET_TOPIC:-debezium_connect_offsets}
      STATUS_STORAGE_TOPIC: ${DEBEZIUM_STATUS_TOPIC:-debezium_connect_statuses}
      # Single-broker Kafka: Connect's internal topics default to 3 replicas, which cannot be created
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      HEAP_OPTS: ${DEBEZIUM_HEAP_OPTS:--Xms256m -Xmx1g}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      GroupNetwork:
        ipv4_address: ${DEBEZIUM_IP:-172.20.10.80}
        aliases:
          - debezium
    ports:
      - "${DEBEZIUM_PORT:-8118}:8083" # Kafka Connect REST API
networks:
  GroupNetwork:
    driver: bridge
    external: true

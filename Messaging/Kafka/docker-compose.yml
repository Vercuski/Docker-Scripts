# Single-node Kafka in KRaft mode (no ZooKeeper).
# Kafka 4.x / Confluent Platform 8.x removed ZooKeeper, so the old cp-zookeeper + cp-kafka:latest pair no longer starts.
services:
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.1.0}
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Fixed cluster id so the data folder can be reused across container re-creates
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # INTERNAL: other containers on GroupNetwork (kafka:29092). EXTERNAL: apps on the host (localhost:9092)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-true}"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      GroupNetwork:
        ipv4_address: ${KAFKA_IP:-192.168.16.70}
        aliases:
          - kafka
  kafka-ui:
    # provectuslabs/kafka-ui is no longer maintained; kafbat/kafka-ui is the active fork
    image: ghcr.io/kafbat/kafka-ui:${KAFKA_UI_VERSION:-latest}
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8084}:8080" # 8083 is used by Apache httpd
    environment:
      KAFKA_CLUSTERS_0_NAME: "${KAFKA_UI_CLUSTER_NAME:-local}"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      GroupNetwork:
        ipv4_address: ${KAFKA_UI_IP:-192.168.16.73}
        aliases:
          - kafka-ui
volumes:
  kafka_data:
    name: kafka_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Messaging/Kafka/Kafka/data/
networks:
  GroupNetwork:
    driver: bridge
    external: true

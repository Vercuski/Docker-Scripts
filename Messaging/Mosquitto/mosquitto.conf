# Mosquitto configuration (mounted read-only). The password file is generated from .env when the container starts.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

allow_anonymous false
password_file /mosquitto/passwordfile

# MQTT over TCP
listener 1883 0.0.0.0
# MQTT over WebSockets (browser clients)
listener 9001 0.0.0.0
protocol websockets

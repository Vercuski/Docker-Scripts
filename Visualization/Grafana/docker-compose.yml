services:
  grafana:
    image: grafana/grafana-enterprise:${GRAFANA_VERSION:-latest}
    container_name: grafana
    restart: unless-stopped
    networks:
      GroupNetwork:
        ipv4_address: ${GRAFANA_IP:-192.168.16.110}
        aliases:
          - grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-Password123}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
      # Prometheus, Tempo and Loki data sources (Databases/Prometheus, Observability/OpenTelemetry)
      - ./provisioning:/etc/grafana/provisioning:ro
volumes:
  grafana_storage:
    name: grafana_storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Visualization/Grafana/storage
networks:
  GroupNetwork:
    driver: bridge
    external: true

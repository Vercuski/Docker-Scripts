# Hoppscotch Community Edition (all-in-one image): open-source API client (REST, GraphQL, WebSocket, SSE, MQTT,
# Socket.IO) with workspaces, shared collections and environments.   App: http://localhost:3010
# Admin dashboard: http://localhost:3010/admin - sign-in is by email magic link, delivered to the Mailpit stack.
# Requires the PostgreSQL stack (hoppscotch-db-init creates the role and database, hoppscotch-migrate the schema,
# hoppscotch-init completes the onboarding)
# and the Mailpit stack (http://localhost:8025) to read the sign-in emails.
x-hoppscotch-env: &hoppscotch-env
  DATABASE_URL: postgresql://${HOPPSCOTCH_DB_USER:-hoppscotch}:${HOPPSCOTCH_DB_PASSWORD:-Password123}@postgresql:5432/${HOPPSCOTCH_DB_NAME:-hoppscotch}
services:
  hoppscotch-db-init:
    image: ${HOPPSCOTCH_DB_INIT_IMAGE:-postgres:18}
    container_name: hoppscotch-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${HOPPSCOTCH_DB_ADMIN_USER:-user@user.com}
      PGPASSWORD: ${HOPPSCOTCH_DB_ADMIN_PASSWORD:-Password123}
      DB_NAME: ${HOPPSCOTCH_DB_NAME:-hoppscotch}
      DB_USER: ${HOPPSCOTCH_DB_USER:-hoppscotch}
      DB_PASSWORD: ${HOPPSCOTCH_DB_PASSWORD:-Password123}
    command:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'" | grep -q 1 \
          || psql -d postgres -c "CREATE ROLE \"$$DB_USER\" LOGIN PASSWORD '$$DB_PASSWORD'"
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          && echo "database $$DB_NAME exists" \
          || psql -d postgres -c "CREATE DATABASE \"$$DB_NAME\" OWNER \"$$DB_USER\""
    networks:
      GroupNetwork:
        ipv4_address: ${HOPPSCOTCH_DB_INIT_IP:-172.20.23.80}
  hoppscotch-migrate:
    image: hoppscotch/hoppscotch:${HOPPSCOTCH_VERSION:-2026.10.1}
    container_name: hoppscotch-migrate
    restart: "no"
    depends_on:
      hoppscotch-db-init:
        condition: service_completed_successfully
    environment:
      <<: *hoppscotch-env
    working_dir: /dist/backend
    entrypoint: ["node_modules/.bin/prisma", "migrate", "deploy"]
    networks:
      GroupNetwork:
        ipv4_address: ${HOPPSCOTCH_MIGRATE_IP:-172.20.23.81}
  hoppscotch:
    image: hoppscotch/hoppscotch:${HOPPSCOTCH_VERSION:-2026.10.1}
    container_name: hoppscotch
    restart: unless-stopped
    depends_on:
      hoppscotch-migrate:
        condition: service_completed_successfully
    environment:
      <<: *hoppscotch-env
      # One port: app at /, admin dashboard at /admin, backend at /backend
      ENABLE_SUBPATH_BASED_ACCESS: "true"
      # Encrypts secrets stored in the database: exactly 32 characters, never change it once data exists
      DATA_ENCRYPTION_KEY: ${HOPPSCOTCH_DATA_ENCRYPTION_KEY:-Dk7qL2xV9mR4tW8zB3nF6hJ1sP5cY0aE}
      # Public URLs baked into the web apps at start (auth providers, SMTP, secrets live in the database and are
      # set by hoppscotch-init / the admin dashboard, not by environment variables)
      # Browser origins allowed to call the backend (app, admin dashboard, desktop app)
      WHITELISTED_ORIGINS: http://localhost:${HOPPSCOTCH_PORT:-3010},app://localhost_3200,app://hoppscotch
      VITE_BASE_URL: http://localhost:${HOPPSCOTCH_PORT:-3010}
      VITE_SHORTCODE_BASE_URL: http://localhost:${HOPPSCOTCH_PORT:-3010}
      VITE_ADMIN_URL: http://localhost:${HOPPSCOTCH_PORT:-3010}/admin
      VITE_BACKEND_GQL_URL: http://localhost:${HOPPSCOTCH_PORT:-3010}/backend/graphql
      VITE_BACKEND_WS_URL: ws://localhost:${HOPPSCOTCH_PORT:-3010}/backend/graphql
      VITE_BACKEND_API_URL: http://localhost:${HOPPSCOTCH_PORT:-3010}/backend/v1
      VITE_APP_TOS_LINK: https://docs.hoppscotch.io/support/terms
      VITE_APP_PRIVACY_POLICY_LINK: https://docs.hoppscotch.io/support/privacy
    networks:
      GroupNetwork:
        ipv4_address: ${HOPPSCOTCH_IP:-172.20.23.82}
        aliases:
          - hoppscotch
    ports:
      - "${HOPPSCOTCH_PORT:-3010}:80" # app + /admin + /backend
  hoppscotch-init:
    image: ${HOPPSCOTCH_CURL_IMAGE:-curlimages/curl:8.23.0}
    container_name: hoppscotch-init
    restart: "no"
    depends_on:
      hoppscotch:
        condition: service_started
    environment:
      MAIL_FROM: ${HOPPSCOTCH_MAIL_FROM:-hoppscotch@example.com}
    # First start only: completes onboarding (email magic-link sign-in, SMTP = Mailpit). The backend restarts
    # itself afterwards to load the settings. Later changes: admin dashboard > Settings.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        B=http://hoppscotch:80/backend
        for i in $$(seq 90); do curl -fs $$B/ping >/dev/null && break; sleep 2; done
        if curl -fsS $$B/v1/onboarding/status | grep -q '"onboardingCompleted":true'; then
          echo "onboarding already completed"; exit 0
        fi
        curl -fsS -H 'Content-Type: application/json' -X POST $$B/v1/onboarding/config -d "{
          \"VITE_ALLOWED_AUTH_PROVIDERS\": \"EMAIL\",
          \"MAILER_SMTP_ENABLE\": \"true\", \"MAILER_USE_CUSTOM_CONFIGS\": \"true\",
          \"MAILER_ADDRESS_FROM\": \"$$MAIL_FROM\",
          \"MAILER_SMTP_HOST\": \"mailpit\", \"MAILER_SMTP_PORT\": \"1025\", \"MAILER_SMTP_SECURE\": \"false\",
          \"MAILER_SMTP_IGNORE_TLS\": \"true\", \"MAILER_TLS_REJECT_UNAUTHORIZED\": \"false\" }" >/dev/null
        echo "onboarding completed: email sign-in through Mailpit"
    networks:
      GroupNetwork:
        ipv4_address: ${HOPPSCOTCH_INIT_IP:-172.20.23.83}
networks:
  GroupNetwork:
    driver: bridge
    external: true

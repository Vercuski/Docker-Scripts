# Garage single-node configuration. Secrets are not in this file: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN come
# from the environment (docker-compose.yml / .env).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"

# One node, so one copy of each object
replication_factor = 1

# IPv4 binds: GroupNetwork has no IPv6, and "[::]" makes Garage panic at start
rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
# Virtual-host style: <bucket>.s3.garage.localhost (path style works too)
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "0.0.0.0:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "0.0.0.0:3903"

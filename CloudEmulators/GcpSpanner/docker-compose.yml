# Google Cloud Spanner emulator. State is in memory only: instances and databases are lost on restart.
services:
  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator:${SPANNER_EMULATOR_VERSION:-1.5.59}
    container_name: spanner-emulator
    restart: unless-stopped
    networks:
      GroupNetwork:
        ipv4_address: ${SPANNER_EMULATOR_IP:-172.20.3.90}
        aliases:
          - spanner-emulator
    ports:
      - "${SPANNER_GRPC_PORT:-9011}:9010" # gRPC (9010 is used by Portainer)
      - "${SPANNER_REST_PORT:-9020}:9020" # REST
networks:
  GroupNetwork:
    driver: bridge
    external: true

# Azure Event Hubs emulator. Stores checkpoints and metadata in Azure Storage - uses the Azurite stack (CloudEmulators/Azurite).
services:
  eventhubs-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:${EVENTHUBS_EMULATOR_VERSION:-2.2.1}
    container_name: eventhubs-emulator
    restart: unless-stopped
    volumes:
      # Event hubs and consumer groups are declared here (the emulator has no management API for creating them)
      - ./Config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    environment:
      ACCEPT_EULA: "${EVENTHUBS_ACCEPT_EULA:-Y}"
      BLOB_SERVER: "${EVENTHUBS_STORAGE_HOST:-azurite}"
      METADATA_SERVER: "${EVENTHUBS_STORAGE_HOST:-azurite}"
    ports:
      - "${EVENTHUBS_AMQP_PORT:-5674}:5672" # AMQP (5672 is used by RabbitMQ, 5673 by the Service Bus emulator)
      - "${EVENTHUBS_KAFKA_PORT:-9094}:9092" # Kafka protocol (9092 is used by the Kafka stack)
      - "${EVENTHUBS_HTTP_PORT:-5301}:5300" # Health (5300 is used by the Service Bus emulator)
    networks:
      GroupNetwork:
        ipv4_address: ${EVENTHUBS_EMULATOR_IP:-172.20.3.40}
        aliases:
          - eventhubs-emulator
networks:
  GroupNetwork:
    driver: bridge
    external: true

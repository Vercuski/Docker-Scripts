# Semaphore UI: web UI, scheduler and audit log for Ansible playbooks, Terraform/OpenTofu, PowerShell and Bash
# tasks run from git repositories (e.g. ones in the Gitea stack). UI: http://localhost:3004 (admin / Password123)
# Requires the PostgreSQL stack; semaphore-db-init creates the semaphore role and database.
services:
  semaphore-db-init:
    image: ${SEMAPHORE_DB_INIT_IMAGE:-postgres:18}
    container_name: semaphore-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${SEMAPHORE_DB_ADMIN_USER:-user@user.com}
      PGPASSWORD: ${SEMAPHORE_DB_ADMIN_PASSWORD:-Password123}
      DB_NAME: ${SEMAPHORE_DB_NAME:-semaphore}
      DB_USER: ${SEMAPHORE_DB_USER:-semaphore}
      DB_PASSWORD: ${SEMAPHORE_DB_PASSWORD:-Password123}
    command:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'" | grep -q 1 \
          || psql -d postgres -c "CREATE ROLE \"$$DB_USER\" LOGIN PASSWORD '$$DB_PASSWORD'"
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          && echo "database $$DB_NAME exists" \
          || psql -d postgres -c "CREATE DATABASE \"$$DB_NAME\" OWNER \"$$DB_USER\""
    networks:
      GroupNetwork:
        ipv4_address: ${SEMAPHORE_DB_INIT_IP:-172.20.9.40}
  semaphore:
    image: semaphoreui/semaphore:${SEMAPHORE_VERSION:-v2.20.24}
    container_name: semaphore
    restart: unless-stopped
    depends_on:
      semaphore-db-init:
        condition: service_completed_successfully
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: postgresql
      SEMAPHORE_DB_PORT: 5432
      SEMAPHORE_DB: ${SEMAPHORE_DB_NAME:-semaphore}
      SEMAPHORE_DB_USER: ${SEMAPHORE_DB_USER:-semaphore}
      SEMAPHORE_DB_PASS: ${SEMAPHORE_DB_PASSWORD:-Password123}
      SEMAPHORE_DB_OPTIONS: '{"sslmode":"disable"}'
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN_USER:-admin}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:-Password123}
      SEMAPHORE_ADMIN_NAME: Administrator
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@example.com}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:-bG9jYWwtZGV2LXNlbWFwaG9yZS1lbmNyeXB0LTAwMDE=}
      SEMAPHORE_PLAYBOOK_PATH: /tmp/semaphore
      SEMAPHORE_EMAIL_ALERT: "true"
      SEMAPHORE_EMAIL_HOST: mailpit
      SEMAPHORE_EMAIL_PORT: "1025"
      SEMAPHORE_EMAIL_SENDER: semaphore@dev.localhost
      TZ: America/New_York
    volumes:
      - semaphore_data:/var/lib/semaphore
    networks:
      GroupNetwork:
        ipv4_address: ${SEMAPHORE_IP:-172.20.9.41}
        aliases:
          - semaphore
    ports:
      - "${SEMAPHORE_PORT:-3004}:3000"
volumes:
  semaphore_data:
    name: semaphore_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/IaC/Semaphore/data
networks:
  GroupNetwork:
    driver: bridge
    external: true

services:
  terraform:
    image: hashicorp/terraform:latest
    container_name: terraform
    restart: unless-stopped
    # The image's entrypoint is the terraform CLI, which exits immediately (causing a restart loop).
    # Keep the container alive and run commands with: docker exec -it terraform terraform plan
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.50
        aliases:
          - terraform
    volumes:
      - .:/infra
    working_dir: /infra
    environment:
      TZ: "America/New_York"
  gaia:
    image: gaiaapp/gaia:latest
    container_name: gaia
    restart: unless-stopped
    depends_on:
      - mongo
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.51
        aliases:
          - gaia
    ports:
      - "8085:8080" # 8080 is used by CockroachDB
    environment:
      GAIA_MONGODB_URI: mongodb://gaia-mongo/gaia
      GAIA_RUNNER_API_PASSWORD: "123456"
      GAIA_EXTERNAL_URL: http://gaia:8080
  runner:
    image: gaiaapp/runner:latest
    container_name: runner
    restart: unless-stopped
    depends_on:
      - gaia
    environment:
      GAIA_URL: http://gaia:8080
      GAIA_RUNNER_API_PASSWORD: "123456"
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.52
        aliases:
          - gaiarunner
    volumes:
      # The runner starts terraform containers, so it needs the host Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
  mongo:
    # Gaia's documented MongoDB version (the project is no longer actively maintained; newer servers are untested)
    image: mongo:4.4
    container_name: gaia-mongo
    restart: unless-stopped
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.53
        aliases:
          - gaia-mongo
    volumes:
      - terraform_data:/data/db
volumes:
  terraform_data:
    name: terraform_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/IaC/Terraform/data
networks:
  GroupNetwork:
    driver: bridge
    external: true

# Terraform CLI in a long-running container; this folder is mounted at /infra.
#   docker exec -it terraform terraform init
# (The Gaia web UI that used to live here was removed: the project is unmaintained. See IaC/Atlantis for
#  pull-request driven plan/apply and IaC/Semaphore for a web UI.)
services:
  terraform:
    image: hashicorp/terraform:${TERRAFORM_VERSION:-latest}
    container_name: terraform
    restart: unless-stopped
    # The image's entrypoint is the terraform CLI, which exits immediately (causing a restart loop).
    # Keep the container alive and run commands with: docker exec -it terraform terraform plan
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    networks:
      GroupNetwork:
        ipv4_address: ${TERRAFORM_IP:-172.20.9.10}
        aliases:
          - terraform
    volumes:
      - .:/infra
    working_dir: /infra
    environment:
      TZ: "${TERRAFORM_TZ:-America/New_York}"
networks:
  GroupNetwork:
    driver: bridge
    external: true

# Static Envoy configuration (mounted read-only; restart the container after editing).
# One HTTP listener round-robining over the Nginx and Apache stacks, like HAProxy.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: webservers
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: webservers }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: webservers
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # Docker's DNS: names resolve once the target stacks are running
      dns_lookup_family: V4_ONLY
      health_checks:
        - timeout: 2s
          interval: 10s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: / }
      load_assignment:
        cluster_name: webservers
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: nginx, port_value: 80 } } }
              - endpoint: { address: { socket_address: { address: apache, port_value: 80 } } }

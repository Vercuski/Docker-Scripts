# Kong Gateway (OSS) in DB-less mode: all routes, services, upstreams and plugins come from ./kong.yml.
#   Proxy: http://localhost:8131   Admin API: http://localhost:8132   Kong Manager: http://localhost:8133
services:
  kong:
    image: kong:${KONG_VERSION:-3.9.4}
    container_name: kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://localhost:${KONG_MANAGER_PORT:-8133}
      KONG_ADMIN_GUI_API_URL: http://localhost:${KONG_ADMIN_PORT:-8132}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-notice}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    networks:
      GroupNetwork:
        ipv4_address: ${KONG_IP:-172.20.14.70}
        aliases:
          - kong
    ports:
      - "${KONG_PROXY_PORT:-8131}:8000" # Proxy
      - "${KONG_ADMIN_PORT:-8132}:8001" # Admin API
      - "${KONG_MANAGER_PORT:-8133}:8002" # Kong Manager
networks:
  GroupNetwork:
    driver: bridge
    external: true

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Resolve container names through Docker's embedded DNS so backends can start after HAProxy
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 10s

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s

frontend http_in
    bind *:8100
    default_backend web_servers

backend web_servers
    balance roundrobin
    option httpchk GET /
    default-server init-addr last,libc,none resolvers docker check
    server nginx  nginx:80
    server apache apache:80

services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped

    ports:
      # These ports are in format <host-port>:<container-port>
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP

    environment:
      TZ: "America/New_York"

      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: 'true'

    volumes:
      - npmdata:/data
      - npmletsencrypt:/etc/letsencrypt
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.161
        aliases:
          - nginxproxymanager

volumes:
  npmdata:
    name: npmdata
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}\docker\volumes\RP-LB\NginxProxyManager\data
  npmletsencrypt:
    name: npmletsencrypt
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}\docker\volumes\RP-LB\NginxProxyManager\letsencrypt

networks:
  GroupNetwork:
    driver: bridge
    external: true
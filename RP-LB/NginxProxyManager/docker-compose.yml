services:
  app:
    image: jc21/nginx-proxy-manager:${NPM_VERSION:-latest}
    container_name: nginx-proxy-manager
    restart: unless-stopped

    ports:
      # These ports are in format <host-port>:<container-port>
      - "${NPM_HTTP_PORT:-80}:80" # Public HTTP Port
      - "${NPM_HTTPS_PORT:-443}:443" # Public HTTPS Port
      - "${NPM_ADMIN_PORT:-81}:81" # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP

    environment:
      TZ: "${NPM_TZ:-America/New_York}"

      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: "${NPM_DISABLE_IPV6:-true}"

    volumes:
      - npmdata:/data
      - npmletsencrypt:/etc/letsencrypt
      # nginx snippets for proxy hosts' Advanced tab, e.g. Authelia forward-auth (see snippets/ and Authentication/Authelia)
      - ./snippets:/snippets:ro
    networks:
      GroupNetwork:
        ipv4_address: ${NPM_IP:-172.20.14.20}
        aliases:
          - nginxproxymanager

volumes:
  npmdata:
    name: npmdata
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/RP-LB/NginxProxyManager/data
  npmletsencrypt:
    name: npmletsencrypt
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/RP-LB/NginxProxyManager/letsencrypt

networks:
  GroupNetwork:
    driver: bridge
    external: true
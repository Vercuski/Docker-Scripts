# Caddy 2: web server and reverse proxy with automatic HTTPS. Configured by ./Caddyfile.
#   http://localhost:8128    https://localhost:8134 (certificate from Caddy's local CA)
# Can also serve static files: mount a folder and add a `file_server` site to the Caddyfile.
services:
  caddy:
    image: caddy:${CADDY_VERSION:-2.11.9-alpine}
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      GroupNetwork:
        ipv4_address: ${CADDY_IP:-172.20.14.40}
        aliases:
          - caddy
    ports:
      - "${CADDY_HTTP_PORT:-8128}:80" # HTTP
      - "${CADDY_HTTPS_PORT:-8134}:443" # HTTPS (local CA)
volumes:
  caddy_data:
    name: caddy_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/RP-LB/Caddy/data
  caddy_config:
    name: caddy_config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/RP-LB/Caddy/config
networks:
  GroupNetwork:
    driver: bridge
    external: true

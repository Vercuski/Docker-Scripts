services:
  registry:
    image: registry:3
    container_name: registry-server
    restart: unless-stopped
    ports:
      - 5000:5000
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
      # CORS headers are not needed: the UI proxies registry calls through its own nginx (NGINX_PROXY_PASS_URL)
    volumes:
      - registry_data:/data
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.180
        aliases:
          - dockerregistry
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    restart: unless-stopped
    depends_on:
      - registry
    ports:
      - 5001:80
    environment:
      - SINGLE_REGISTRY=true
      - REGISTRY_TITLE=Docker Registry UI
      - DELETE_IMAGES=true
      - SHOW_CONTENT_DIGEST=true
      # Must be reachable from inside the UI container - "localhost" would point at the UI itself
      - NGINX_PROXY_PASS_URL=http://dockerregistry:5000
      - SHOW_CATALOG_NB_TAGS=true
      - CATALOG_MIN_BRANCHES=1
      - CATALOG_MAX_BRANCHES=1
      - TAGLIST_PAGE_SIZE=100
      - REGISTRY_SECURED=false
      - CATALOG_ELEMENTS_LIMIT=1000
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.181
        aliases:
          - dockerregistryui
volumes:
  registry_data:
    name: registry_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Containerization/DockerRegistry/data/
networks:
  GroupNetwork:
    driver: bridge
    external: true

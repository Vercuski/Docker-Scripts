services:
  mysql:
    image: mysql:${MYSQL_VERSION:-latest}
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-db}"
      MYSQL_USER: "${MYSQL_USER:-user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-Password123}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-Password123}"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      GroupNetwork:
        ipv4_address: ${MYSQL_IP:-192.168.16.15}
        aliases:
          - mysqldb
    volumes:
      - MySQL_Data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_VERSION:-latest}
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    networks:
      GroupNetwork:
        ipv4_address: ${PHPMYADMIN_IP:-192.168.16.20}
        aliases:
          - phpmyadmin
volumes:
  MySQL_Data:
    name: MySQL_Data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/MySQL
networks:
  GroupNetwork:
    driver: bridge
    external: true

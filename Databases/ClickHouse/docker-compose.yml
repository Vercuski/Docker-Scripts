services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-latest}
    container_name: clickhouse-server
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123" # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000" # Native client (host 9000 is used by SonarQube)
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-admin}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-Password123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default_db}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: ${CLICKHOUSE_NOFILE_LIMIT:-262144}
        hard: ${CLICKHOUSE_NOFILE_LIMIT:-262144}
    networks:
      GroupNetwork:
        ipv4_address: ${CLICKHOUSE_IP:-192.168.16.29}
        aliases:
          - clickhouse
volumes:
  clickhouse_data:
    name: clickhouse_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/ClickHouse/data
  clickhouse_logs:
    name: clickhouse_logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/ClickHouse/logs
networks:
  GroupNetwork:
    driver: bridge
    external: true

services:
  postgres:
    # Official PostgreSQL image plus the pgvector extension (run CREATE EXTENSION vector; per database).
    # Same Debian (trixie) base as postgres:18, so existing data folders keep working.
    # Pin the major version (pg18): a different major requires pg_upgrade on existing data.
    # PostgreSQL 18+ keeps data under /var/lib/postgresql/<major>/docker, so mount /var/lib/postgresql.
    image: pgvector/pgvector:${PGVECTOR_VERSION:-pg18-trixie}
    container_name: postgresql
    restart: unless-stopped
    # wal_level=logical lets Debezium (Messaging/Debezium) stream changes; it only adds WAL detail, data is unaffected
    command:
      - postgres
      - -c
      - wal_level=${POSTGRES_WAL_LEVEL:-logical}
      - -c
      - max_replication_slots=${POSTGRES_MAX_REPLICATION_SLOTS:-10}
      - -c
      - max_wal_senders=${POSTGRES_MAX_WAL_SENDERS:-10}
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-user@user.com}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Password123}"
    networks:
      GroupNetwork:
        ipv4_address: ${POSTGRES_IP:-172.20.6.130}
        aliases:
          - postgresql
    logging:
      options:
        max-size: "${POSTGRES_LOG_MAX_SIZE:-10m}"
        max-file: "${POSTGRES_LOG_MAX_FILE:-3}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql
      # copy the sql script to create tables
      # - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
  pgadmin4:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: pgadmin4
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-user@user.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-Password123}"
    networks:
      GroupNetwork:
        ipv4_address: ${PGADMIN_IP:-172.20.6.131}
        aliases:
          - pgadmin4
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin4_data:/var/lib/pgadmin
volumes:
  postgresql_data:
    name: postgresql_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Databases/PostgreSQL/Data
  pgadmin4_data:
    name: pgadmin4_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Databases/PostgreSQL/pgadmin4data
networks:
  GroupNetwork:
    driver: bridge
    external: true

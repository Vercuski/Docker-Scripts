# Memcached: in-memory cache (no persistence, no authentication).
services:
  memcached:
    image: memcached:${MEMCACHED_VERSION:-1.6-alpine}
    container_name: memcached
    restart: unless-stopped
    command: memcached -m ${MEMCACHED_MEMORY_MB:-256} -c ${MEMCACHED_MAX_CONNECTIONS:-1024}
    networks:
      GroupNetwork:
        ipv4_address: ${MEMCACHED_IP:-172.20.6.200}
        aliases:
          - memcached
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
networks:
  GroupNetwork:
    driver: bridge
    external: true

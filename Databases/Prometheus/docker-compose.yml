services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-latest}
    container_name: prometheus
    restart: unless-stopped
    volumes:
      # Config lives in this repo (a missing host file would be created as a directory and Prometheus would not start)
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      # Lets Tempo's metrics-generator push span metrics / service graphs (Observability/OpenTelemetry)
      - '--web.enable-remote-write-receiver'
    networks:
      GroupNetwork:
        ipv4_address: ${PROMETHEUS_IP:-192.168.16.26}
        aliases:
          - prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-latest}
    container_name: node-exporter
    restart: unless-stopped
    # Reads the Docker host (on Docker Desktop: the docker-desktop VM), not empty bind folders
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      GroupNetwork:
        ipv4_address: ${NODE_EXPORTER_IP:-192.168.16.27}
        aliases:
          - node-exporter
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-latest}
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      GroupNetwork:
        ipv4_address: ${ALERTMANAGER_IP:-192.168.16.28}
        aliases:
          - alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
volumes:
  alertmanager_data:
    name: alertmanager_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/Prometheus/alertmanager
  prometheus_data:
    name: prometheus_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/Prometheus/prometheus_data
networks:
  GroupNetwork:
    driver: bridge
    external: true

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # Other stacks on GroupNetwork that expose Prometheus metrics - uncomment as needed
  # - job_name: rabbitmq          # requires the rabbitmq_prometheus plugin (enabled by default in 3.8+)
  #   static_configs:
  #     - targets: ['rabbitmq:15692']
  # - job_name: milvus
  #   static_configs:
  #     - targets: ['milvus-standalone:9091']
  # - job_name: minio
  #   metrics_path: /minio/v2/metrics/cluster
  #   static_configs:
  #     - targets: ['milvus-minio:9000']
  # - job_name: aspnetcore        # your .NET apps via OpenTelemetry.Exporter.Prometheus.AspNetCore
  #   static_configs:
  #     - targets: ['host.docker.internal:5080']

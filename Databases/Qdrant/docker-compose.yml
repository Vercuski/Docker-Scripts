# Qdrant: vector database (similarity search with payload filtering) for Semantic Kernel / RAG work.
# A lighter alternative to the Milvus stack.
services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.20.2}
    container_name: qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-Password123}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      GroupNetwork:
        ipv4_address: ${QDRANT_IP:-172.20.6.210}
        aliases:
          - qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333" # REST + dashboard
      - "${QDRANT_GRPC_PORT:-6334}:6334" # gRPC
volumes:
  qdrant_storage:
    name: qdrant_storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Databases/Qdrant/storage
networks:
  GroupNetwork:
    driver: bridge
    external: true

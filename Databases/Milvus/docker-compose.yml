services:
  etcd:
    container_name: milvus-etcd
    restart: unless-stopped
    image: quay.io/coreos/etcd:${MILVUS_ETCD_VERSION:-v3.5.18}
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=${MILVUS_ETCD_AUTO_COMPACTION_RETENTION:-1000}
      - ETCD_QUOTA_BACKEND_BYTES=${MILVUS_ETCD_QUOTA_BACKEND_BYTES:-4294967296}
      - ETCD_SNAPSHOT_COUNT=${MILVUS_ETCD_SNAPSHOT_COUNT:-50000}
    volumes:
      - ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/Milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      GroupNetwork:
        ipv4_address: ${MILVUS_ETCD_IP:-192.168.16.40}
        aliases:
          - milvus-etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    restart: unless-stopped
    image: minio/minio:${MILVUS_MINIO_VERSION:-RELEASE.2024-05-28T17-19-04Z}
    environment:
      MINIO_ACCESS_KEY: "${MILVUS_MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MILVUS_MINIO_SECRET_KEY:-minioadmin}"
    ports:
      - "${MILVUS_MINIO_CONSOLE_PORT:-9111}:9001" # MinIO console (9100 is used by Prometheus node-exporter)
      - "${MILVUS_MINIO_API_PORT:-9110}:9000" # MinIO S3 API
    networks:
      GroupNetwork:
        ipv4_address: ${MILVUS_MINIO_IP:-192.168.16.41}
        aliases:
          - milvus-minio
    volumes:
      - ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/Milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    restart: unless-stopped
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.5.27}
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: "${MILVUS_MINIO_REGION:-us-east-1}"
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    networks:
      GroupNetwork:
        ipv4_address: ${MILVUS_IP:-192.168.16.42}
        aliases:
          - milvus-standalone
    volumes:
      - ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/Milvus/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    depends_on:
      - "etcd"
      - "minio"

networks:
  GroupNetwork:
    driver: bridge
    external: true

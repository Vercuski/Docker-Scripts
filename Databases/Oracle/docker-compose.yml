services:
  oracle-db:
    image: container-registry.oracle.com/database/enterprise:${ORACLE_VERSION:-latest}
    container_name: OracleDb
    restart: unless-stopped
    environment:
      - ORACLE_SID=${ORACLE_SID:-ORCLCDB}
      - ORACLE_PDB=${ORACLE_PDB:-ORCLPDB1}
      - ORACLE_PWD=${ORACLE_PWD:-Password123}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - oracle-backup:/opt/oracle/backup
    healthcheck:
      # Script shipped in Oracle's image (the previous sqlplus check used the wrong password and a missing .sql file)
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    networks:
      GroupNetwork:
        ipv4_address: ${ORACLE_IP:-192.168.16.25}
        aliases:
          - oracle
volumes:
  oracle-data:
    name: oracle-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/Oracle/Data
  oracle-backup:
    name: oracle-backup
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/Oracle/Backup
networks:
  GroupNetwork:
    driver: bridge
    external: true

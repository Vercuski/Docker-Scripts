services:
  mongodb:
    image: mongo:${MONGO_VERSION:-latest}
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:-user}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-Password123}"
    networks:
      GroupNetwork:
        ipv4_address: ${MONGO_IP:-192.168.16.13}
        aliases:
          - mongodb
    volumes:
      - MongoDb_Data:/data/db
  mongo-express:
    image: mongo-express:${MONGO_EXPRESS_VERSION:-latest}
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "${MONGO_EXPRESS_PORT:-8088}:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: "${MONGO_EXPRESS_USERNAME:-user}"
      ME_CONFIG_BASICAUTH_PASSWORD: "${MONGO_EXPRESS_PASSWORD:-Password123}"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      # mongo-express 1.x connects via URL; the old *_AUTH_USERNAME/SERVER vars were not being used for the root login
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_ROOT_USERNAME:-user}:${MONGO_ROOT_PASSWORD:-Password123}@mongodb:27017/?authSource=admin"
    networks:
      GroupNetwork:
        ipv4_address: ${MONGO_EXPRESS_IP:-192.168.16.24}
        aliases:
          - mongoexpress
volumes:
  MongoDb_Data:
    name: MongoDb_Data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/MongoDb/data
networks:
  GroupNetwork:
    driver: bridge
    external: true

services:
  cockroachDb:
    image: cockroachdb/cockroach:${COCKROACH_VERSION:-latest}
    container_name: cockroachdb
    restart: unless-stopped
    ports:
      - "${COCKROACH_SQL_PORT:-26257}:26257"
      - "${COCKROACH_UI_PORT:-8080}:8080"
    environment:
      - COCKROACH_DATABASE=${COCKROACH_DATABASE:-myapp_dev}
      - COCKROACH_USER=${COCKROACH_USER:-developer}
      # COCKROACH_PASSWORD is ignored in --insecure mode (passwords require a secure cluster)
    command: start-single-node --insecure
    networks:
      GroupNetwork:
        ipv4_address: ${COCKROACH_IP:-192.168.16.11}
        aliases:
          - cockroachdb
    volumes:
      - CockroachDB:/cockroach/cockroach-data
volumes:
  CockroachDB:
    name: CockroachDB
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/CockroachDB/data
networks:
  GroupNetwork:
    driver: bridge
    external: true

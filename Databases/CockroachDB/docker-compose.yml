services:
  cockroachDb:
    image: cockroachdb/cockroach:latest
    container_name: cockroachdb
    restart: unless-stopped
    ports:
      - 26257:26257
      - 8080:8080
    environment:
      - COCKROACH_DATABASE=myapp_dev
      - COCKROACH_USER=developer
      - COCKROACH_PASSWORD=Password123
    command: start-single-node --insecure
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.11
        aliases:
          - cockroachdb
    volumes:
      - CockroachDB:/cockroach/cockroach-data
volumes:
  CockroachDB:
    name: CockroachDB
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/CockroachDB/data
networks:
  GroupNetwork:
    driver: bridge
    external: true

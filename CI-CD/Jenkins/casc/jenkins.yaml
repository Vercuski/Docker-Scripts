# Jenkins Configuration as Code - applied on every start, so the admin password always matches .env.
# ${...} values come from the container environment (set in docker-compose.yml from .env).
jenkins:
  systemMessage: "Docker-Scripts local Jenkins (configured from casc/jenkins.yaml)"
  numExecutors: ${JENKINS_EXECUTORS}
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "${JENKINS_PUBLIC_URL}"
  # Gitea stack (SourceControl/Gitea): repos, PR builds and webhooks to http://jenkins:8080/gitea-webhook/post
  giteaServers:
    servers:
      - displayName: "Gitea"
        serverUrl: "http://gitea:3000"
        manageHooks: false

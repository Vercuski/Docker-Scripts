# Woodpecker CI: container-native CI for the Gitea stack (.woodpecker/*.yaml pipelines in each repo).
#   UI: http://localhost:8146 - "Login" signs in with your Gitea account (OAuth2)
# woodpecker-init logs in to Gitea with YOUR Gitea admin account (set in .env), creates the "Woodpecker" OAuth2
# application if needed and stores its client id/secret in the data volume; the server reads them on start.
# Requires the Gitea stack (installer completed, webhooks to private addresses allowed - see SourceControl/Gitea).
services:
  woodpecker-init:
    image: ${WOODPECKER_CURL_IMAGE:-curlimages/curl:8.23.0}
    container_name: woodpecker-init
    restart: "no"
    user: "1000:1000"
    environment:
      ADMIN_USER: ${WOODPECKER_GITEA_ADMIN_USER:-gitea_admin}
      ADMIN_PASSWORD: ${WOODPECKER_GITEA_ADMIN_PASSWORD:-Password123}
      REDIRECT_URI: http://localhost:${WOODPECKER_PORT:-8146}/authorize
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        API=http://gitea:3000/api/v1
        D=/woodpecker-data
        for i in $$(seq 60); do curl -fs http://gitea:3000/api/healthz >/dev/null && break; echo "waiting for gitea (start SourceControl/Gitea)"; sleep 2; done
        code=$$(curl -s -o /dev/null -w '%{http_code}' -u "$$ADMIN_USER:$$ADMIN_PASSWORD" "$$API/user")
        if [ "$$code" != 200 ]; then
          echo "Gitea admin login failed (HTTP $$code): finish the Gitea installer, then set WOODPECKER_GITEA_ADMIN_USER/PASSWORD in .env"
          exit 1
        fi
        if [ -s "$$D/gitea-app-id" ] && [ -s "$$D/gitea-client" ] && [ -s "$$D/gitea-secret" ] &&
           [ "$$(curl -s -o /dev/null -w '%{http_code}' -u "$$ADMIN_USER:$$ADMIN_PASSWORD" "$$API/user/applications/oauth2/$$(cat $$D/gitea-app-id)")" = 200 ]; then
          echo "Gitea OAuth2 application for Woodpecker exists"; exit 0
        fi
        resp=$$(curl -fsS -u "$$ADMIN_USER:$$ADMIN_PASSWORD" -H "Content-Type: application/json" -X POST "$$API/user/applications/oauth2" \
          -d "{\"name\":\"Woodpecker\",\"redirect_uris\":[\"$$REDIRECT_URI\"],\"confidential_client\":true}")
        echo "$$resp" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' > "$$D/gitea-app-id"
        echo "$$resp" | sed -n 's/.*"client_id":"\([^"]*\)".*/\1/p' > "$$D/gitea-client"
        echo "$$resp" | sed -n 's/.*"client_secret":"\([^"]*\)".*/\1/p' > "$$D/gitea-secret"
        [ -s "$$D/gitea-client" ] && [ -s "$$D/gitea-secret" ] || { echo "could not create the OAuth2 application"; exit 1; }
        echo "created Gitea OAuth2 application Woodpecker (redirect $$REDIRECT_URI)"
    volumes:
      - woodpecker_data:/woodpecker-data
    networks:
      GroupNetwork:
        ipv4_address: ${WOODPECKER_INIT_IP:-172.20.22.30}
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:${WOODPECKER_VERSION:-v3.20.1}-alpine
    container_name: woodpecker-server
    restart: unless-stopped
    depends_on:
      woodpecker-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        export WOODPECKER_GITEA_CLIENT="$$(cat /var/lib/woodpecker/gitea-client)"
        export WOODPECKER_GITEA_SECRET="$$(cat /var/lib/woodpecker/gitea-secret)"
        exec /bin/woodpecker-server
    environment:
      WOODPECKER_HOST: http://localhost:${WOODPECKER_PORT:-8146}
      WOODPECKER_GITEA: "true"
      # API calls go over GroupNetwork; the browser is sent to Gitea's host port for the OAuth2 login
      WOODPECKER_GITEA_URL: http://gitea:3000
      WOODPECKER_EXPERT_FORGE_OAUTH_HOST: ${WOODPECKER_GITEA_PUBLIC_URL:-http://localhost:3001}
      # Gitea delivers push / PR webhooks to this address
      WOODPECKER_EXPERT_WEBHOOK_HOST: http://woodpecker-server:8000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-local-dev-woodpecker-agent-secret}
      # Signs agent sessions; fixed so agents stay connected across server restarts
      WOODPECKER_GRPC_SECRET: ${WOODPECKER_GRPC_SECRET:-local-dev-woodpecker-grpc-secret}
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN:-gitea_admin}
      WOODPECKER_OPEN: ${WOODPECKER_OPEN:-true}
      WOODPECKER_DISABLE_VERSION_CHECK: "true"
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    healthcheck:
      test: ["CMD", "/bin/woodpecker-server", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      GroupNetwork:
        ipv4_address: ${WOODPECKER_SERVER_IP:-172.20.22.31}
        aliases:
          - woodpecker-server
          - woodpecker
    ports:
      - "${WOODPECKER_PORT:-8146}:8000" # UI + API + webhooks
  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:${WOODPECKER_VERSION:-v3.20.1}
    container_name: woodpecker-agent
    restart: unless-stopped
    depends_on:
      woodpecker-server:
        condition: service_healthy
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-local-dev-woodpecker-agent-secret}
      WOODPECKER_HOSTNAME: ${WOODPECKER_AGENT_NAME:-docker-agent}
      WOODPECKER_MAX_WORKFLOWS: ${WOODPECKER_MAX_WORKFLOWS:-2}
      # Pipeline steps run on GroupNetwork, so they reach other stacks by alias (e.g. postgresql, gitea)
      WOODPECKER_BACKEND_DOCKER_NETWORK: GroupNetwork
    volumes:
      # Agent id, so a restart doesn't register a new agent
      - woodpecker_agent:/etc/woodpecker
      # Steps run as sibling containers on the host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      GroupNetwork:
        ipv4_address: ${WOODPECKER_AGENT_IP:-172.20.22.32}
        aliases:
          - woodpecker-agent
volumes:
  woodpecker_data:
    name: woodpecker_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/CI-CD/Woodpecker/data
  woodpecker_agent:
    name: woodpecker_agent
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/CI-CD/Woodpecker/agent
networks:
  GroupNetwork:
    driver: bridge
    external: true

# Rundeck Community: job scheduler and runbook automation (scripts, commands and workflows on nodes, cron schedules,
# web UI and API).   UI + API: http://localhost:4440 (admin / Password123)
# Requires the PostgreSQL stack; rundeck-db-init creates the rundeck role and database.
services:
  rundeck-db-init:
    image: ${RUNDECK_DB_INIT_IMAGE:-postgres:18}
    container_name: rundeck-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${RUNDECK_DB_ADMIN_USER:-user@user.com}
      PGPASSWORD: ${RUNDECK_DB_ADMIN_PASSWORD:-Password123}
      DB_NAME: ${RUNDECK_DB_NAME:-rundeck}
      DB_USER: ${RUNDECK_DB_USER:-rundeck}
      DB_PASSWORD: ${RUNDECK_DB_PASSWORD:-Password123}
    command:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'" | grep -q 1 \
          || psql -d postgres -c "CREATE ROLE \"$$DB_USER\" LOGIN PASSWORD '$$DB_PASSWORD'"
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          && echo "database $$DB_NAME exists" \
          || psql -d postgres -c "CREATE DATABASE \"$$DB_NAME\" OWNER \"$$DB_USER\""
    networks:
      GroupNetwork:
        ipv4_address: ${RUNDECK_DB_INIT_IP:-172.20.15.40}
  rundeck:
    image: rundeck/rundeck:${RUNDECK_VERSION:-6.3.0}
    container_name: rundeck
    restart: unless-stopped
    depends_on:
      rundeck-db-init:
        condition: service_completed_successfully
    environment:
      RUNDECK_GRAILS_URL: http://localhost:${RUNDECK_PORT:-4440}
      RUNDECK_SERVER_FORWARDED: "true"
      RUNDECK_DATABASE_DRIVER: org.postgresql.Driver
      RUNDECK_DATABASE_URL: jdbc:postgresql://postgresql:5432/${RUNDECK_DB_NAME:-rundeck}
      RUNDECK_DATABASE_USERNAME: ${RUNDECK_DB_USER:-rundeck}
      RUNDECK_DATABASE_PASSWORD: ${RUNDECK_DB_PASSWORD:-Password123}
      ADMIN_USER: ${RUNDECK_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${RUNDECK_ADMIN_PASSWORD:-Password123}
      ADMIN_API_TOKEN: ${RUNDECK_API_TOKEN:-local-dev-rundeck-api-token}
      RUNDECK_TOKENS_FILE: /home/rundeck/etc/tokens.properties
    # Write the admin account into realm.properties (the image ships admin:admin) and a static API token for it
    # (header X-Rundeck-Auth-Token), then start Rundeck as usual
    entrypoint:
      - /tini
      - --
      - sh
      - -c
      - |
        printf '%s:%s,user,admin\n' "$$ADMIN_USER" "$$ADMIN_PASSWORD" > /home/rundeck/server/config/realm.properties
        printf '%s: %s, admin\n' "$$ADMIN_USER" "$$ADMIN_API_TOKEN" > /home/rundeck/etc/tokens.properties
        exec docker-lib/entry.sh
    volumes:
      # Execution output logs (jobs, projects, keys and schedules are stored in PostgreSQL)
      - rundeck_logs:/home/rundeck/var/logs
    networks:
      GroupNetwork:
        ipv4_address: ${RUNDECK_IP:-172.20.15.41}
        aliases:
          - rundeck
    ports:
      - "${RUNDECK_PORT:-4440}:4440" # UI + API
volumes:
  rundeck_logs:
    name: rundeck_logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Scheduling/Rundeck/logs
networks:
  GroupNetwork:
    driver: bridge
    external: true

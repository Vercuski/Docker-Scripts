# n8n: visual workflow automation (schedule and webhook triggers, HTTP/database/queue nodes, JavaScript/Python code).
#   UI + webhooks: http://localhost:5678 (admin@example.com / Password123)
# Requires the PostgreSQL stack; n8n-db-init creates the n8n role and database, n8n-init creates the owner account,
# n8n-runners executes Code nodes (JavaScript and Python) outside the main process.
services:
  n8n-db-init:
    image: ${N8N_DB_INIT_IMAGE:-postgres:18}
    container_name: n8n-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${N8N_DB_ADMIN_USER:-user@user.com}
      PGPASSWORD: ${N8N_DB_ADMIN_PASSWORD:-Password123}
      DB_NAME: ${N8N_DB_NAME:-n8n}
      DB_USER: ${N8N_DB_USER:-n8n}
      DB_PASSWORD: ${N8N_DB_PASSWORD:-Password123}
    command:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'" | grep -q 1 \
          || psql -d postgres -c "CREATE ROLE \"$$DB_USER\" LOGIN PASSWORD '$$DB_PASSWORD'"
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          && echo "database $$DB_NAME exists" \
          || psql -d postgres -c "CREATE DATABASE \"$$DB_NAME\" OWNER \"$$DB_USER\""
    networks:
      GroupNetwork:
        ipv4_address: ${N8N_DB_INIT_IP:-172.20.15.50}
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.47.7}
    container_name: n8n
    restart: unless-stopped
    depends_on:
      n8n-db-init:
        condition: service_completed_successfully
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgresql
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-Password123}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-b5c540acaf789ac01df141beee755773817ddeaa46179802}
      N8N_HOST: localhost
      N8N_PORT: 5678
      # Default is "::", which fails on a network without IPv6
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
      TZ: ${N8N_TIMEZONE:-UTC}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Code nodes (JavaScript and Python) run in the n8n-runners container
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-e1e56e082b2a161e08327bb0a99d467a}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    networks:
      GroupNetwork:
        ipv4_address: ${N8N_IP:-172.20.15.51}
        aliases:
          - n8n
    ports:
      - "${N8N_PORT:-5678}:5678" # UI, REST API and webhooks
  n8n-runners:
    image: n8nio/runners:${N8N_VERSION:-2.47.7}
    container_name: n8n-runners
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:-e1e56e082b2a161e08327bb0a99d467a}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-UTC}
    networks:
      GroupNetwork:
        ipv4_address: ${N8N_RUNNERS_IP:-172.20.15.53}
  n8n-init:
    image: n8nio/n8n:${N8N_VERSION:-2.47.7}
    container_name: n8n-init
    restart: "no"
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      OWNER_EMAIL: ${N8N_OWNER_EMAIL:-admin@example.com}
      OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:-Password123}
    # Same as clicking through "Set up owner account" on the first visit; skipped once an owner exists
    entrypoint:
      - node
      - -e
      - |
        (async () => {
          const base = "http://n8n:5678/rest";
          const s = await (await fetch(base + "/settings")).json();
          if (!s.data.userManagement.showSetupOnFirstLoad) { console.log("owner already set up"); return; }
          const r = await fetch(base + "/owner/setup", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: process.env.OWNER_EMAIL, password: process.env.OWNER_PASSWORD, firstName: "Admin", lastName: "User" }) });
          if (!r.ok) { console.error("owner setup failed:", r.status, await r.text()); process.exit(1); }
          console.log("owner created:", process.env.OWNER_EMAIL);
        })().catch(e => { console.error(e); process.exit(1); });
    networks:
      GroupNetwork:
        ipv4_address: ${N8N_INIT_IP:-172.20.15.52}
volumes:
  n8n_data:
    name: n8n_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Scheduling/N8n/data
networks:
  GroupNetwork:
    driver: bridge
    external: true

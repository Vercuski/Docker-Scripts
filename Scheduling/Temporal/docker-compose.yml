# Temporal: durable execution for workflows written in code (.NET SDK: Temporalio NuGet package).
#   Frontend (gRPC): localhost:7233 (from other containers: temporal:7233)   Web UI: http://localhost:8135
# Requires the PostgreSQL stack. Start order is handled here:
#   temporal-db-init (role + databases) -> temporal-schema (create/upgrade schemas) -> temporal
#   -> temporal-namespace-init (creates the namespace) and temporal-ui
services:
  temporal-db-init:
    image: ${TEMPORAL_DB_INIT_IMAGE:-postgres:18}
    container_name: temporal-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${TEMPORAL_DB_ADMIN_USER:-user@user.com}
      PGPASSWORD: ${TEMPORAL_DB_ADMIN_PASSWORD:-Password123}
      DB_USER: ${TEMPORAL_DB_USER:-temporal}
      DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-Password123}
    command:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'" | grep -q 1 \
          || psql -d postgres -c "CREATE ROLE \"$$DB_USER\" LOGIN PASSWORD '$$DB_PASSWORD'"
        for db in temporal temporal_visibility; do
          psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1 \
            && echo "database $$db exists" \
            || psql -d postgres -c "CREATE DATABASE \"$$db\" OWNER \"$$DB_USER\""
        done
    networks:
      GroupNetwork:
        ipv4_address: ${TEMPORAL_DB_INIT_IP:-172.20.15.20}
  temporal-schema:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.32.2}
    container_name: temporal-schema
    restart: "no"
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgresql
      SQL_PORT: 5432
      SQL_USER: ${TEMPORAL_DB_USER:-temporal}
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:-Password123}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # setup-schema is a no-op on an existing schema; update-schema applies any newer versions (safe to rerun)
        for db in temporal:temporal temporal_visibility:visibility; do
          name=$${db%%:*}; dir=$${db##*:}
          SQL_DATABASE=$$name temporal-sql-tool setup-schema -v 0.0 >/dev/null 2>&1 || true
          out=$$(SQL_DATABASE=$$name temporal-sql-tool update-schema -d /etc/temporal/schema/postgresql/v12/$$dir/versioned 2>&1) \
            || { echo "$$out"; echo "$$name: schema update FAILED"; exit 1; }
          echo "$$out" | grep -E "Schema updated" || true
          echo "$$name: schema up to date"
        done
    networks:
      GroupNetwork:
        ipv4_address: ${TEMPORAL_SCHEMA_IP:-172.20.15.21}
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.32.2}
    container_name: temporal
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-Password123}
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: ${TEMPORAL_IP:-172.20.15.22}
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
    networks:
      GroupNetwork:
        ipv4_address: ${TEMPORAL_IP:-172.20.15.22}
        aliases:
          - temporal
    ports:
      - "${TEMPORAL_PORT:-7233}:7233" # gRPC frontend
  temporal-namespace-init:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.32.2}
    container_name: temporal-namespace-init
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      RETENTION: ${TEMPORAL_NAMESPACE_RETENTION:-72h}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 60); do temporal operator cluster health >/dev/null 2>&1 && break; echo "waiting for temporal"; sleep 3; done
        if temporal operator namespace describe -n "$$NAMESPACE" >/dev/null 2>&1; then
          echo "namespace $$NAMESPACE exists"
        else
          for i in $$(seq 20); do temporal operator namespace create -n "$$NAMESPACE" --retention "$$RETENTION" && exit 0; sleep 3; done
          exit 1
        fi
    networks:
      GroupNetwork:
        ipv4_address: ${TEMPORAL_NAMESPACE_INIT_IP:-172.20.15.23}
  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.58.1}
    container_name: temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8135}
    networks:
      GroupNetwork:
        ipv4_address: ${TEMPORAL_UI_IP:-172.20.15.24}
        aliases:
          - temporal-ui
    ports:
      - "${TEMPORAL_UI_PORT:-8135}:8080" # Web UI
networks:
  GroupNetwork:
    driver: bridge
    external: true

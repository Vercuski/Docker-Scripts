  wazuh_filebeat_etc:
    name: wazuh_filebeat_etc
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/SIEM/Wazuh/manager/filebeat_etc

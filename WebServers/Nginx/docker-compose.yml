services:
  nginx:
    image: nginx:${NGINX_VERSION:-latest}
    container_name: nginx
    restart: unless-stopped
    networks:
      GroupNetwork:
        ipv4_address: ${NGINX_IP:-192.168.16.130}
        aliases:
          - nginx
    ports:
      - "${NGINX_PORT:-8180}:80" # 80/443 belong to Nginx Proxy Manager
    volumes:
      - ./src:/usr/share/nginx/html:ro
  ui:
    # Nginx UI ships its own nginx instance; it manages the config in the nginx_conf volume, not the "nginx" service above
    image: uozi/nginx-ui:${NGINX_UI_VERSION:-latest}
    container_name: nginx-ui
    restart: unless-stopped
    networks:
      GroupNetwork:
        ipv4_address: ${NGINX_UI_IP:-192.168.16.131}
        aliases:
          - nginxui
    ports:
      - "${NGINX_UI_PORT:-8181}:80" # 8080 is used by CockroachDB
      - "${NGINX_UI_HTTPS_PORT:-8443}:443"
    environment:
      TZ: "${NGINX_UI_TZ:-America/New_York}"
    volumes:
      - nginx_conf:/etc/nginx
      - nginx_ui:/etc/nginx-ui
      - nginx_www:/var/www
volumes:
  nginx_ui:
    name: nginx_ui
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/WebServers/Nginx-UI
  nginx_conf:
    name: nginx_conf
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/WebServers/Nginx/Nginx
  nginx_www:
    name: nginx_www
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/WebServers/Nginx/www
networks:
  GroupNetwork:
    driver: bridge
    external: true

services:
  mediawiki:
    image: mediawiki:${MEDIAWIKI_VERSION:-latest}
    container_name: mediawiki
    restart: unless-stopped
    # First run: complete the web installer (SQLite is simplest - use /var/www/data), then place
    # the generated LocalSettings.php into the html volume folder and restart.
    ports:
      - "${MEDIAWIKI_PORT:-8281}:80" # 8081 is reserved for the Cosmos DB emulator
    volumes:
      - mediawiki_data:/var/www/html/
    networks:
      GroupNetwork:
        ipv4_address: ${MEDIAWIKI_IP:-192.168.16.31}
        aliases:
          - mediawiki
volumes:
  mediawiki_data:
    name: mediawiki_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Documentation/Mediawiki/html/
networks:
  GroupNetwork:
    driver: bridge
    external: true

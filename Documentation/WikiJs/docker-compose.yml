# Wiki.js 3: Markdown/visual wiki with Git storage sync, diagrams and full-text search. UI: http://localhost:3003
# Requires the PostgreSQL stack (PostgreSQL 17+); wikijs-db-init creates the wikijs role and database.
services:
  wikijs-db-init:
    image: ${WIKIJS_DB_INIT_IMAGE:-postgres:18}
    container_name: wikijs-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${WIKIJS_DB_ADMIN_USER:-user@user.com}
      PGPASSWORD: ${WIKIJS_DB_ADMIN_PASSWORD:-Password123}
      DB_NAME: ${WIKIJS_DB_NAME:-wikijs}
      DB_USER: ${WIKIJS_DB_USER:-wikijs}
      DB_PASSWORD: ${WIKIJS_DB_PASSWORD:-Password123}
    command:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'" | grep -q 1 \
          || psql -d postgres -c "CREATE ROLE \"$$DB_USER\" LOGIN PASSWORD '$$DB_PASSWORD'"
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          && echo "database $$DB_NAME exists" \
          || psql -d postgres -c "CREATE DATABASE \"$$DB_NAME\" OWNER \"$$DB_USER\""
    networks:
      GroupNetwork:
        ipv4_address: ${WIKIJS_DB_INIT_IP:-172.20.7.30}
  wikijs:
    image: requarks/wiki:${WIKIJS_VERSION:-3.4}
    container_name: wikijs
    restart: unless-stopped
    depends_on:
      wikijs-db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${WIKIJS_DB_NAME:-wikijs}
      DB_USER: ${WIKIJS_DB_USER:-wikijs}
      DB_PASS: ${WIKIJS_DB_PASSWORD:-Password123}
      ADMIN_EMAIL: ${WIKIJS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASS: ${WIKIJS_ADMIN_PASSWORD:-Password123}
    volumes:
      - wikijs_data:/wiki/data
    networks:
      GroupNetwork:
        ipv4_address: ${WIKIJS_IP:-172.20.7.31}
        aliases:
          - wikijs
    ports:
      - "${WIKIJS_PORT:-3003}:3000"
volumes:
  wikijs_data:
    name: wikijs_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Documentation/WikiJs/data
networks:
  GroupNetwork:
    driver: bridge
    external: true

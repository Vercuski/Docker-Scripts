# Outline: Notion-style team knowledge base with real-time collaborative editing. UI: http://localhost:3002
# Outline has no local accounts, so the stack bundles Dex as a minimal OIDC provider:
# log in with admin@example.com / Password123 (users in dex.yaml). To use Keycloak or Authentik instead, see ReadMe.md.
# Requires the PostgreSQL stack (outline-db-init creates the outline role and database); mail goes to Mailpit.
services:
  outline-db-init:
    image: ${OUTLINE_DB_INIT_IMAGE:-postgres:18}
    container_name: outline-db-init
    restart: "no"
    environment:
      PGHOST: postgresql
      PGUSER: ${OUTLINE_DB_ADMIN_USER:-user@user.com}
      PGPASSWORD: ${OUTLINE_DB_ADMIN_PASSWORD:-Password123}
      DB_NAME: ${OUTLINE_DB_NAME:-outline}
      DB_USER: ${OUTLINE_DB_USER:-outline}
      DB_PASSWORD: ${OUTLINE_DB_PASSWORD:-Password123}
    command:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 30); do pg_isready -q -d postgres && break; echo "waiting for postgresql (start Databases/PostgreSQL)"; sleep 2; done
        psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$$DB_USER'" | grep -q 1 \
          || psql -d postgres -c "CREATE ROLE \"$$DB_USER\" LOGIN PASSWORD '$$DB_PASSWORD'"
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$DB_NAME'" | grep -q 1 \
          && echo "database $$DB_NAME exists" \
          || psql -d postgres -c "CREATE DATABASE \"$$DB_NAME\" OWNER \"$$DB_USER\""
    networks:
      GroupNetwork:
        ipv4_address: ${OUTLINE_DB_INIT_IP:-172.20.7.50}

  outline-redis:
    image: redis:${OUTLINE_REDIS_VERSION:-8-alpine}
    container_name: outline-redis
    restart: unless-stopped
    networks:
      GroupNetwork:
        ipv4_address: ${OUTLINE_REDIS_IP:-172.20.7.51}
        aliases:
          - outline-redis

  outline-dex:
    image: ghcr.io/dexidp/dex:${DEX_VERSION:-v2.41.1}
    container_name: outline-dex
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      DEX_PORT: ${DEX_PORT:-5556}
      OUTLINE_URL: http://localhost:${OUTLINE_PORT:-3002}
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:-Password123}
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
    networks:
      GroupNetwork:
        ipv4_address: ${OUTLINE_DEX_IP:-172.20.7.52}
        aliases:
          - outline-dex
    ports:
      - "${DEX_PORT:-5556}:${DEX_PORT:-5556}"

  outline:
    image: outlinewiki/outline:${OUTLINE_VERSION:-1.13.0}
    container_name: outline
    restart: unless-stopped
    depends_on:
      outline-db-init:
        condition: service_completed_successfully
      outline-redis:
        condition: service_started
      outline-dex:
        condition: service_started
    environment:
      NODE_ENV: production
      URL: http://localhost:${OUTLINE_PORT:-3002}
      PORT: 3000
      FORCE_HTTPS: "false"
      SECRET_KEY: ${OUTLINE_SECRET_KEY:-01f8acc6f602a1fb3e60a80312359af6e09606e84e3efd79161258072280de3b}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:-fe4166293444fb2efdc448d7c4cf2ab407a2cd5961f6c880c35110996ad18842}
      DATABASE_URL: postgres://${OUTLINE_DB_USER:-outline}:${OUTLINE_DB_PASSWORD:-Password123}@postgresql:5432/${OUTLINE_DB_NAME:-outline}
      PGSSLMODE: disable
      REDIS_URL: redis://outline-redis:6379
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: ${OUTLINE_UPLOAD_MAX_SIZE:-26214400}
      # OIDC: the browser goes to Dex on localhost, Outline's server calls Dex over GroupNetwork
      OIDC_CLIENT_ID: outline
      OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:-Password123}
      OIDC_AUTH_URI: http://localhost:${DEX_PORT:-5556}/dex/auth
      OIDC_TOKEN_URI: http://outline-dex:${DEX_PORT:-5556}/dex/token
      OIDC_USERINFO_URI: http://outline-dex:${DEX_PORT:-5556}/dex/userinfo
      OIDC_USERNAME_CLAIM: preferred_username
      OIDC_DISPLAY_NAME: Dex (local)
      OIDC_SCOPES: openid profile email
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM_EMAIL: outline@dev.localhost
    volumes:
      - outline_data:/var/lib/outline/data
    networks:
      GroupNetwork:
        ipv4_address: ${OUTLINE_IP:-172.20.7.53}
        aliases:
          - outline
    ports:
      - "${OUTLINE_PORT:-3002}:3000"
volumes:
  outline_data:
    name: outline_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?run CreateVolumes.bat or CreateVolumes.sh first}/docker/volumes/Documentation/Outline/data
networks:
  GroupNetwork:
    driver: bridge
    external: true

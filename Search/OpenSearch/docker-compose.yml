services:
  opensearch-node1:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-node1
    restart: unless-stopped
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true # along with the memlock settings below, disables swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # minimum and maximum Java heap size, recommend setting both to 50% of system RAM
      # Required since 2.12 - the demo security config refuses to start without a strong admin password
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    ports:
      - ${OPENSEARCH_PORT:-9201}:9200 # 9200 is used by Elasticsearch
      - ${OPENSEARCH_PA_PORT:-9601}:9600 # Performance Analyzer
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.156 # .154/.155 are Filebeat/Logstash
        aliases:
          - opensearch-node1
  opensearch-node2:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-node2
    restart: unless-stopped
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Set OPENSEARCH_INITIAL_ADMIN_PASSWORD in .env}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.157
        aliases:
          - opensearch-node2
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    restart: unless-stopped
    depends_on:
      - opensearch-node1
      - opensearch-node2
    ports:
      - ${OPENSEARCH_DASHBOARDS_PORT:-5602}:5601 # 5601 is used by Kibana
    environment:
      # Single-quoted: the previous value was invalid YAML (nested double quotes)
      OPENSEARCH_HOSTS: '["https://opensearch-node1:9200","https://opensearch-node2:9200"]'
    networks:
      GroupNetwork:
        ipv4_address: 192.168.16.158
        aliases:
          - opensearchdashboard

volumes:
  opensearch-data1:
    name: opensearch-data1
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Search/OpenSearch/node1/
  opensearch-data2:
    name: opensearch-data2
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Search/OpenSearch/node2/

networks:
  GroupNetwork:
    driver: bridge
    external: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins: ["*"] # browser telemetry (local dev)

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}
  resourcedetection:
    detectors: [env, system]
    override: false

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    # Loki 3.x native OTLP ingestion
    endpoint: http://loki:3100/otlp
  prometheus:
    # Scraped by Prometheus (job "otel-collector" in Databases/Prometheus/prometheus.yml)
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic
  # Optional: also forward everything to the standalone Aspire Dashboard (Observability/AspireDashboard).
  # Uncomment here AND add "otlp/aspire" to each pipeline's exporters below.
  # otlp/aspire:
  #   endpoint: aspire-dashboard:18889
  #   tls:
  #     insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [prometheus]
